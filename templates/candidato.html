<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<div class="container mt-5">
    <div class="card shadow p-4">
        <h2 class="mb-4">Registro de Candidato</h2>

        <form action="/registrar_candidato" method="POST" enctype="multipart/form-data">

            <label class="form-label">Nombre completo</label>
            <input class="form-control mb-3" type="text" name="nombre" placeholder="Ingrese su nombre" required>

            <label class="form-label">Correo electrónico</label>
            <input class="form-control mb-3" type="email" name="correo" placeholder="ejemplo@gmail.com" required>

            <label class="form-label">Teléfono</label>
            <input class="form-control mb-3" type="text" name="telefono" placeholder="Ingrese su teléfono">

            <label class="form-label">Subir CV</label>
            <input class="form-control mb-3" type="file" name="cv" accept=".pdf,.docx" required>

            <button class="btn btn-success">
                Registrar candidato
            </button>

            <a href="/" class="btn btn-secondary ms-2">Volver</a>
        </form>
    </div>
</div>
