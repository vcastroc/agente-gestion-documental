{% extends "base.html" %}

{% block content %}

<div class="text-white mb-4">
    <h2 class="fw-bold">Análisis Inteligente de CVs</h2>
    <p>Resultados generados por el agente autónomo.</p>
</div>

<div class="card shadow p-4">

    <div class="alert alert-primary">
        🤖 El agente analizará habilidades, experiencia y compatibilidad con la vacante.
    </div>

    <table class="table table-hover">

        <thead class="table-dark">
            <tr>
                <th>Candidato</th>
                <th>Compatibilidad</th>
                <th>Estado</th>
            </tr>
        </thead>

        <tbody>

            <tr>
                <td>Pendiente</td>
                <td>-</td>
                <td>
                    <span class="badge bg-warning">
                        Sin analizar
                    </span>
                </td>
            </tr>

        </tbody>

    </table>

    <div class="mt-3">
        <button class="btn btn-success">
            Analizar CVs
        </button>

        <a href="/admin" class="btn btn-secondary">
            Volver
        </a>
    </div>

</div>

{% endblock %}
