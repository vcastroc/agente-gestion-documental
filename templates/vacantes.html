<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<div class="container mt-5">

    <h2>Vacantes Registradas</h2>

    <table class="table table-striped">

        <tr>
            <th>Cargo</th>
            <th>Empresa</th>
            <th>Experiencia</th>
        </tr>

        {% for v in vacantes %}
        <tr>
            <td>{{ v.cargo }}</td>
            <td>{{ v.empresa }}</td>
            <td>{{ v.experiencia }}</td>
        </tr>
        {% endfor %}

    </table>

</div>
