{% extends "base.html" %}

{% block content %}

<div class="text-white mb-4">
    <h2>Registrar Vacante</h2>
    <p>Crea una nueva oferta para que el agente analice candidatos.</p>
</div>

<div class="card shadow p-4">
    <form action="/guardar_vacante" method="POST">

        <label class="form-label">Cargo</label>
        <input class="form-control mb-3" type="text" name="cargo" required>

        <label class="form-label">Empresa</label>
        <input class="form-control mb-3" type="text" name="empresa" required>

        <label class="form-label">Requisitos</label>
        <textarea class="form-control mb-3" name="requisitos" rows="5" required></textarea>

        <label class="form-label">Experiencia mínima</label>
        <input class="form-control mb-3" type="text" name="experiencia">

        <button class="btn btn-primary">Guardar Vacante</button>
        <a href="/admin" class="btn btn-secondary">Volver</a>

    </form>
</div>

{% endblock %}
