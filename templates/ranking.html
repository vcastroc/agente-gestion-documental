{% extends "base.html" %}

{% block content %}

<div class="text-white mb-4">
    <h2 class="fw-bold">Ranking de Candidatos</h2>
    <p>Clasificación generada automáticamente por el agente.</p>
</div>

<div class="card shadow p-4">

    <table class="table table-hover">

        <thead class="table-dark">
            <tr>
                <th>#</th>
                <th>Candidato</th>
                <th>Compatibilidad</th>
                <th>Estado</th>
            </tr>
        </thead>

        <tbody>

            <tr>
                <td>🥇</td>
                <td>Pendiente</td>
                <td>-</td>
                <td>
                    <span class="badge bg-success">
                        Top candidato
                    </span>
                </td>
            </tr>

        </tbody>

    </table>

    <a href="/admin" class="btn btn-secondary">
        Volver
    </a>

</div>

{% endblock %}
