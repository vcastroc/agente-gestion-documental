<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<!DOCTYPE html>
<html>
<head>
    <title>Candidatos Registrados</title>
</head>
<body>

<h2>Candidatos Registrados</h2>

<table class="table table-striped table-bordered mt-4">
    <tr>
        <th>Nombre</th>
        <th>Correo</th>
        <th>Teléfono</th>
        <th>CV</th>
    </tr>

    {% for c in candidatos %}
    <tr>
        <td>{{ c.nombre }}</td>
        <td>{{ c.correo }}</td>
        <td>{{ c.telefono }}</td>
        <td>{{ c.cv }}</td>
    </tr>
    {% endfor %}

</table>

<br>

<a href="/admin">Volver al Panel Administrador</a>

</body>
</html>
