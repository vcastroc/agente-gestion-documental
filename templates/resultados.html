{% extends "base.html" %}

{% block content %}
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<h2>Resultados para: {{ cargo }}</h2>

<table class="table table-striped">
    <tr>
        <th>Candidato</th>
        <th>Compatibilidad</th>
        <th>Estado</th>
    </tr>

    {% for r in resultados %}
    <tr>
        <td>{{ r.nombre }}</td>
        <td>{{ r.compatibilidad }}%</td>
        <td>{{ r.estado }}</td>
    </tr>
    {% endfor %}
</table>
