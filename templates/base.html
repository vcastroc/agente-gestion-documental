<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Agente de Reclutamiento</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<style>

body{
    background:#0b1020;
}

.card{
    border:none;
    border-radius:15px;
}

.form-control{
    border-radius:10px;
}

.btn{
    border-radius:10px;
}

.card{
    transition: 0.3s;
}

.card:hover{
    transform: translateY(-5px);
}

</style>
</head>

<body>

<div class="container-fluid">

    <div class="row">

        <div class="col-md-2 bg-dark min-vh-100 p-3">

            <h4 class="text-white">
                🤖 TalentIA
            </h4>

            <hr class="text-secondary">

            <a href="/" class="btn btn-dark w-100 mb-2">
                Inicio
            </a>

            <a href="/admin" class="btn btn-dark w-100 mb-2">
                Dashboard
            </a>

            <a href="/candidatos" class="btn btn-dark w-100 mb-2">
                Candidatos
            </a>

            <a href="/vacantes" class="btn btn-dark w-100 mb-2">
                Vacantes
            </a>

            <a href="/analisis" class="btn btn-dark w-100 mb-2">
                Análisis
            </a>

            <a href="/ranking" class="btn btn-dark w-100 mb-2">
                Ranking
            </a>

            <a href="/acerca" class="btn btn-dark w-100">
                Acerca
            </a>

        </div>

        <div class="col-md-10 p-4">
            {% block content %}
            {% endblock %}
        </div>

    </div>

</div>

</body>
<footer class="text-center text-white mt-5 p-4">
    <hr class="text-secondary">

    <p>
        TalentIA © 2026
    </p>

    <p>
        Agente Autónomo para Reclutamiento Inteligente
    </p>
</footer>
</html>
